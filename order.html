<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Body Scent</a>
      <nav class="nav-links">
        <a href="index.html" class="">หน้าแรก</a>
        <a href="product.html" class="">สินค้าทั้งหมด</a>
        <a href="order.html" class="active">สั่งซื้อสินค้า</a>
        <a href="admin.html" class="">แอดมิน</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-header">
      <span class="section-subtitle">Order Placement</span>
      <h1 class="section-title">แบบฟอร์มสั่งซื้อสินค้า</h1>
    </div>

    <div class="form-card">
      <form id="orderForm">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า *</label>
          <input type="text" id="customerName" name="customerName" placeholder="กรอกชื่อ-นามสกุลของคุณ" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line ID *</label>
          <input type="text" id="contact" name="contact" placeholder="เช่น 081-234-5678 หรือ Line: @bodyscent" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า *</label>
          <input type="text" id="items" name="items" placeholder="ชื่อสินค้าที่ต้องการสั่งซื้อ" required>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท) *</label>
          <input type="number" id="total" name="total" placeholder="0" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ (ถ้ามี)</label>
          <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติมถึงร้านค้า"></textarea>
        </div>

        <button type="submit" class="btn-gold" style="width: 100%;">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 BODY SCENT &mdash; Crafted Fragrance for Every Mood.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
